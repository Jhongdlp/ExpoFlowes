server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Demo tecnico: fuera de los buscadores (CLAUDE.md §14.5)
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Assets con hash en el nombre (Vite): el contenido nunca cambia bajo el mismo nombre,
    # asi que se puede cachear para siempre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA: cualquier ruta desconocida la resuelve el router del cliente. index.html si se
    # cachea, referencia bundles viejos (con datos demo obsoletos, como paso con la clave
    # de admin) tras cada deploy: sin cache-control explicito el navegador podia servirlo
    # de memoria por heuristica. Debe revalidar siempre.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
