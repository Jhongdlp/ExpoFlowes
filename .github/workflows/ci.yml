# Las mismas comprobaciones que el README manda correr a mano, ejecutadas en cada push.
# Sin esto, "ruff, mypy y 205 tests en verde" es una afirmacion; con esto es comprobable
# sin clonar el repositorio.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (ruff · mypy · pytest)
    runs-on: ubuntu-latest

    # Los tests de integracion son contra Postgres de verdad, no SQLite: el esquema usa
    # indices parciales, CHECK y SELECT ... FOR UPDATE. Probar contra otro motor probaria
    # otra cosa.
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: expoflores
          POSTGRES_PASSWORD: expoflores
          POSTGRES_DB: expoflores
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # `conftest.py` crea `<base>_test` a partir de esta URL y la borra al terminar.
      DATABASE_URL: postgresql+psycopg://expoflores:expoflores@localhost:5432/expoflores
      # Valor de usar y tirar: en CI no hay ningun dato real que proteger. El secreto de
      # produccion vive en el entorno del despliegue, nunca en el repositorio (§8.6).
      SECRET_KEY: clave-de-ci-no-es-un-secreto

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - run: pip install -e '.[dev]'

      - name: Lint
        run: ruff check .

      - name: Formato
        run: ruff format --check .

      - name: Tipos
        run: mypy app

      - name: Tests
        run: pytest -q

  frontend:
    name: Frontend (oxlint · vitest · build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # `build` es `tsc -b && vite build`: el chequeo de tipos estricto va dentro. Si el
      # backend cambia un campo y no se regenero `schema.d.ts`, esto falla aqui (§13).
      - name: Tipos y build
        run: npm run build

  deploy:
    name: Deploy (Dokploy)
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    # El deploy solo dispara si lint/tests de ambos jobs pasaron: nunca se despliega
    # codigo roto. Dokploy hace pull del commit de `main` y reconstruye el stack completo
    # (docker-compose.yml del repo), no un paso separado de por si.
    steps:
      - name: Disparar deploy en Dokploy
        run: |
          curl -sf -X POST \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"composeId\":\"${{ secrets.DOKPLOY_COMPOSE_ID }}\"}" \
            "${{ secrets.DOKPLOY_HOST }}/api/compose.deploy"
